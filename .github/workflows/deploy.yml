name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      ollama: ${{ steps.filter.outputs.ollama }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for Ollama changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: main
          filters: |
            ollama:
              - 'Ollama/**'

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: brights2026.azurecr.io
          username: students
          password: ${{ secrets.BRIGHTS_ACR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: brights2026.azurecr.io/kad/lmk-chat-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: brights2026.azurecr.io
          username: students
          password: ${{ secrets.BRIGHTS_ACR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: brights2026.azurecr.io/kad/lmk-chat:${{ github.sha }}

  ollama:
    needs: changes
    if: needs.changes.outputs.ollama == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: brights2026.azurecr.io
          username: students
          password: ${{ secrets.BRIGHTS_ACR_TOKEN }}

      - name: Build and push Ollama image
        uses: docker/build-push-action@v6
        with:
          context: ./Ollama
          file: ./Ollama/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: brights2026.azurecr.io/kad/lmk-chat-ollama:${{ github.sha }}