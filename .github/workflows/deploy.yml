name: Build and publish

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend packages
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload website
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-frontend:
    if: github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: docker login
        uses: docker/login-action@v4
        with:
          registry: brights2026.azurecr.io
          username: students
          password: ${{ secrets.BRIGHTS_ACR_TOKEN }}

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./UDI_GRAD_PROJECT/dockerfile
          push: true
        #   tags: brights2026.azurecr.io/kad/fotballapi:latest